# M5Stack AtomS3R + ATOMIC Wi-SUN-A1 (BP35A1)
# ESPHome 経由でスマートメーター（Bルート）を Home Assistant に接続する設定例
#
# 必要なもの:
#   - AtomS3R
#   - ATOMIC Wi-SUN-A1 キット
#   - ROHM BP35A1
#   - Bルート ID / パスワード
#
# UART（ATOMIC Wi-SUN-A1 + AtomS3R で確認）
#   AtomS3R GPIO6 (TX) → BP35A1 RX
#   AtomS3R GPIO7 (RX) → BP35A1 TX
#
# 秘密情報は secrets.yaml に書く（このファイルには書かない）

esphome:
  name: wi-sun
  friendly_name: Wi-SUN

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# AtomS3R の 8MB PSRAM
psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wi-SUN-Fallback"
    password: !secret wisun_hotspot_password

captive_portal:

uart:
  id: wisun_uart
  baud_rate: 115200
  tx_pin: GPIO6
  rx_pin: GPIO7
  # 初期接続の確認時だけ有効化する
  # debug:
  #   direction: BOTH
  #   dummy_receiver: true

# Bルート用外部コンポーネント
# タグは https://github.com/homy-newfs8/esphome-broute を確認
external_components:
  - source: github://homy-newfs8/esphome-broute@v0.2.0
    components: [b_route]

b_route:
  uart_id: wisun_uart
  rbid: !secret rb_id
  password: !secret rb_password
  power:
    name: "Instantaneous Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 20s
    force_update: true
  energy:
    name: "Total Energy"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    update_interval: 60s
    force_update: true
